[project]
name = "senetra-ml"
version = "0.1.0"
description = "SENETRA hierarchical federated forecasting: EDA, features, training, evaluation, prediction and monitoring"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "mlflow>=3.1,<4",
    # CPU-only wheel on Linux (Docker): avoids the multi-hundred-MB CUDA/NCCL dependency of `xgboost`.
    "xgboost>=2.1; sys_platform != 'linux'",
    "xgboost-cpu>=2.1; sys_platform == 'linux'",
    "matplotlib>=3.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
senetra-ml = "senetra_ml.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/senetra_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
